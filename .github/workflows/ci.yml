name: Verify Research Desk
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: astral-sh/setup-uv@v6
        with:
          enable-cache: true
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: uv venv .venv
      - run: uv pip install --python .venv/bin/python -r requirements.lock
      - run: uv pip install --python .venv/bin/python -e '.[dev]'
      - run: npm ci
      - run: npm run build
      - run: .venv/bin/ruff check research_desk tests
      - run: .venv/bin/pytest -q
      - run: npx playwright install --with-deps chromium
      - run: npm run test:e2e
      - run: docker build -t research-desk:ci .
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: browser-failure-artifacts
          path: test-results/
