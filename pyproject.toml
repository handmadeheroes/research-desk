[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "research-desk"
version = "1.0.0"
description = "A local research library and investment dashboard operated by you and your dot."
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.34,<1", "python-multipart>=0.0.20",
  "httpx>=0.28,<1", "pypdf>=6,<7", "trafilatura>=2,<3",
  "feedparser>=6,<7", "python-dotenv>=1,<2", "mcp>=2.3,<3", "tzdata>=2025",
]

[project.optional-dependencies]
dev = ["pytest>=8,<10", "pytest-cov>=6,<8", "ruff>=0.12,<1"]

[project.scripts]
research-desk = "research_desk.cli:main"
research-desk-agent = "research_desk.agent:main"
research-desk-mcp = "research_desk.mcp_server:main"

[tool.setuptools.packages.find]
include = ["research_desk*"]

[tool.setuptools.package-data]
research_desk = ["schema.sql", "static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 110
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
